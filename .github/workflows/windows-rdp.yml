name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on:
      - self-hosted
      - windows
      - YOUR_RUNNER_LABEL

    timeout-minutes: 360

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          $rdpPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $tcpPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          Set-ItemProperty -Path $rdpPath -Name 'fDenyTSConnections' -Type DWord -Value 0
          Set-ItemProperty -Path $tcpPath -Name 'UserAuthentication' -Type DWord -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

      - name: Optimize RDP
        shell: powershell
        run: |
          $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'

          if (-not (Test-Path $path)) {
            New-Item -Path $path -Force | Out-Null
          }

          New-ItemProperty -Path $path -Name 'fDisableWallpaper' -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $path -Name 'fDisableFullWindowDrag' -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $path -Name 'fDisableMenuAnims' -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $path -Name 'fDisableThemes' -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $path -Name 'fDisableFontSmoothing' -PropertyType DWord -Value 1 -Force | Out-Null

          powercfg /setactive SCHEME_MIN

      - name: Create RDP User
        shell: powershell
        run: |
          $Username = "Mmdi"
          $PasswordPlain = "P@ssw0rd1qazXSW@#"
          $Password = ConvertTo-SecureString $PasswordPlain -AsPlainText -Force

          if (-not (Get-LocalUser -Name $Username -ErrorAction SilentlyContinue)) {
            New-LocalUser `
              -Name $Username `
              -Password $Password `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

      - name: Install Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $installer = "C:\tailscale.msi"

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process `
            "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 5

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server" `
            --accept-dns=false

          Start-Sleep -Seconds 8

          $ts_ip = & $tailscale ip -4

          Write-Host "=========================================="
          Write-Host "RDP SERVER READY"
          Write-Host "IP       : $ts_ip"
          Write-Host "Username : Mmdi"
          Write-Host "=========================================="

      - name: Keep Alive
        shell: powershell
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "Server running..."
          }
