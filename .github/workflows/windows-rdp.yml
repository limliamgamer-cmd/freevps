name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    timeout-minutes: 360

    steps:

      - name: 1. Enable Remote Desktop
        shell: powershell
        run: |
          $rdpPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $tcpPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          Set-ItemProperty -Path $rdpPath -Name 'fDenyTSConnections' -Type DWord -Value 0
          Set-ItemProperty -Path $tcpPath -Name 'UserAuthentication' -Type DWord -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Set-ItemProperty -Path $tcpPath -Name 'ColorDepth' -Type DWord -Value 4

      - name: 2. Optimize Windows for RDP
        shell: powershell
        run: |
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'

          if (-not (Test-Path $policyPath)) {
              New-Item -Path $policyPath -Force | Out-Null
          }

          New-ItemProperty -Path $policyPath -Name 'fDisableWallpaper' -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name 'fDisableFullWindowDrag' -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name 'fDisableMenuAnims' -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name 'fDisableThemes' -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name 'fDisableFontSmoothing' -PropertyType DWord -Value 1 -Force | Out-Null

          $visualPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects'
          if (-not (Test-Path $visualPath)) {
              New-Item -Path $visualPath -Force | Out-Null
          }

          New-ItemProperty -Path $visualPath -Name 'VisualFXSetting' -PropertyType DWord -Value 2 -Force | Out-Null

          $desktopPath = 'HKCU:\Control Panel\Desktop'
          Set-ItemProperty -Path $desktopPath -Name 'MenuShowDelay' -Type String -Value '0'
          Set-ItemProperty -Path $desktopPath -Name 'DragFullWindows' -Type String -Value '0'

      - name: 3. Reduce Background Load
        shell: powershell
        run: |
          $services = @(
            'DiagTrack',
            'SysMain',
            'MapsBroker',
            'Fax',
            'WSearch'
          )

          foreach ($service in $services) {
              Stop-Service -Name $service -Force -ErrorAction SilentlyContinue
              Set-Service -Name $service -StartupType Disabled -ErrorAction SilentlyContinue
          }

      - name: 4. Create Admin Account
        shell: powershell
        run: |
          $Username = "Mmdi"
          $PasswordPlain = "P@ssw0rd1qazXSW@#"
          $Password = ConvertTo-SecureString $PasswordPlain -AsPlainText -Force

          if (-not (Get-LocalUser -Name $Username -ErrorAction SilentlyContinue)) {
              New-LocalUser `
                -Name $Username `
                -Password $Password `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member $Username -ErrorAction SilentlyContinue

          Write-Host "RDP USER: $Username"
          Write-Host "RDP PASSWORD: $PasswordPlain"

      - name: 5. Install & Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $installer = "C:\tailscale.msi"

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process `
            "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 5

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server" `
            --accept-dns=false

          Start-Sleep -Seconds 8

          $ts_ip = & $tailscale ip -4

          Write-Host "=================================================="
          Write-Host "RDP SERVER IS READY!"
          Write-Host "Tailscale IP : $ts_ip"
          Write-Host "Username     : Mmdi"
          Write-Host "Password     : $PasswordPlain"
          Write-Host "=================================================="

      - name: 6. Keep Server Alive (Very Long)
        shell: powershell
        run: |
          $totalMinutes = 999999999

          for ($i = 1; $i -le $totalMinutes; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/$totalMinutes] Server running..."
          }
