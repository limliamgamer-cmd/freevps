name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: 1. Enable Remote Desktop
        shell: powershell
        run: |
          $rdpPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $tcpPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          Set-ItemProperty -Path $rdpPath -Name 'fDenyTSConnections' -Type DWord -Value 0
          Set-ItemProperty -Path $tcpPath -Name 'UserAuthentication' -Type DWord -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

      - name: 2. Max Performance
        shell: powershell
        run: |
          # High Performance power plan
          powercfg /setactive SCHEME_MIN

          # Disable visual effects
          $visualPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects'
          if (-not (Test-Path $visualPath)) {
              New-Item -Path $visualPath -Force | Out-Null
          }

          Set-ItemProperty -Path $visualPath -Name 'VisualFXSetting' -Type DWord -Value 2

          # Disable unnecessary RDP effects
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $policyPath)) {
              New-Item -Path $policyPath -Force | Out-Null
          }

          New-ItemProperty -Path $policyPath -Name 'fDisableWallpaper' -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name 'fDisableFullWindowDrag' -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name 'fDisableMenuAnims' -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name 'fDisableThemes' -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name 'fDisableFontSmoothing' -PropertyType DWord -Value 1 -Force | Out-Null

      - name: 3. Create Admin Account
        shell: powershell
        run: |
          $Username = "Mmdi"
          $PasswordPlain = "P@ssw0rd1qazXSW@#"
          $Password = ConvertTo-SecureString $PasswordPlain -AsPlainText -Force

          $user = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue

          if (-not $user) {
              New-LocalUser `
                -Name $Username `
                -Password $Password `
                -PasswordNeverExpires `
                -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host "Username: $Username"

      - name: 4. Install Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $installer = "C:\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 5

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server" `
            --accept-dns=false

          Start-Sleep -Seconds 8

          $ts_ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "RDP SERVER READY"
          Write-Host "Tailscale IP : $ts_ip"
          Write-Host "Username     : Mmdi"
          Write-Host "Password     : $PasswordPlain"
          Write-Host "=============================================="

      - name: 5. Detect CPU And Disk
        shell: powershell
        run: |
          Write-Host "===== CPU ====="
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors |
            Format-List

          Write-Host "===== RAM ====="
          Get-CimInstance Win32_ComputerSystem |
            Select-Object TotalPhysicalMemory |
            Format-List

          Write-Host "===== DISK ====="
          Get-PhysicalDisk |
            Select-Object FriendlyName, MediaType, Size |
            Format-Table -AutoSize

      - name: 6. Keep Server Alive
        shell: powershell
        run: |
          while ($true) {
              Start-Sleep -Seconds 60
              Write-Host "Server running..."
          }
